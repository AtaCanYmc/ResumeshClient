[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resumesh-client"
version = "0.1.0"
description = "FastAPI web REST API client backend service for ResuMesh"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Ata Can Yaymacı" },
]
keywords = ["fastapi", "resumesh", "client", "backend", "portfolio", "cv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "supabase>=2.30.0",
    "slowapi>=0.1.10",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "sentry-sdk>=1.39.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resumesh_client"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
