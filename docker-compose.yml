version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:[YOUR-PASSWORD]@db.ahrbyydizkchgoocsifx.supabase.co:5432/postgres}
      - SUPABASE_URL=${SUPABASE_URL:-https://ahrbyydizkchgoocsifx.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-sb_publishable_dJd-NCXuVoECVs4o4uvmKQ_MDp-KSw1}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
